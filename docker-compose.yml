services:

  msa-chat-service:
    image: postgres:18
    container_name: msa-chat-service
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 3472
    ports:
      - "5433:5432"
    volumes:
      - chat-db-data:/var/lib/postgresql/data

volumes:
  chat-db-data: